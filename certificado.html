<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Certificado</title>
<link rel="stylesheet" href="/app.css">
<script src="/config.js"></script>
</head>
<body>
<div id="header"></div>

<section class="hero"><div class="wrap">
  <h1>Certificado</h1>
  <div class="crumbs"><a href="/">Inicio</a> / Certificado</div>
</div></section>

<main><div class="wrap">
  <div id="res" class="card"><div class="body muted">Consultando certificado…</div></div>
  <div class="card search-card"><div class="body">
    <form action="/" onsubmit="event.preventDefault(); location.href='/?folio='+encodeURIComponent(this.q.value)">
      <input name="q" placeholder="Verificar otro folio" required>
      <button class="btn" type="submit">Verificar</button>
    </form>
  </div></div>
</div></main>

<div id="footer"></div>
<script src="/app.js"></script>
<script>
(async () => {
  const box = document.getElementById('res');
  const m = location.pathname.match(/\/certificado\/([0-9a-fA-F-]{36})/);
  const noEncontrado = t => box.innerHTML =
    `<div class="status none">${esc(t)}</div><div class="body"><p>Verifica que escaneaste el código correcto o comunícate con nosotros.</p></div>`;
  if (!m) return noEncontrado('Código de certificado no válido');

  try {
    const r = await api({ id: m[1] });
    if (!r.ok) return noEncontrado('No encontramos este certificado');
    const c = r.cert;
    const est = String(c.estatus || 'Vigente').trim();
    const dmy = t => { const x = String(t || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return x ? new Date(+x[3], x[2] - 1, +x[1], 23, 59) : null; };
    const fin = dmy(c.fin);
    const vencido = est === 'Vigente' && fin && fin < new Date();
    const valido = est === 'Vigente' && !vencido;
    const titulo = valido ? '✔ Certificado vigente' : vencido ? '✖ Certificado vencido' : '✖ Certificado ' + est.toLowerCase();
    document.title = 'Certificado: ' + c.centro + ' | ' + EMPRESA.nombre;
    const campo = (k, v) => (v !== '' && v != null) ? `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>` : '';
    box.innerHTML = `
      <div class="status ${valido ? 'ok' : 'bad'}">${esc(titulo)}</div>
      <div class="body">
        <p class="label">Certificado otorgado al centro de trabajo</p>
        <p class="name">${esc(c.centro)}</p>
        ${c.alcance ? `<p class="course">Alcance: ${esc(c.alcance)}</p>` : ''}
        <dl>
          ${campo('Folio del certificado', c.folioCert)}
          ${campo('Folio', c.folio)}
          ${campo('Estatus', vencido ? 'Vencido' : est)}
          ${campo('Entidad federativa', c.entidad)}
          ${campo('Sector', c.sector)}
          ${campo('Fecha de inicio', c.inicio)}
          ${campo('Fecha de término', c.fin)}
          ${campo('Mujeres', c.mujeres)}
          ${campo('Hombres', c.hombres)}
          ${campo('Total de personal', c.total)}
          ${campo('Puntaje obtenido', c.puntaje)}
        </dl>
        <p class="note">Información emitida por ${esc(EMPRESA.razonSocial || EMPRESA.nombre)}. Consulta realizada el ${new Date().toLocaleDateString('es-MX')}.</p>
      </div>`;
  } catch (e) {
    box.innerHTML = `<div class="status none">No se pudo consultar</div><div class="body"><p>Intenta de nuevo en unos minutos.</p></div>`;
  }
})();
</script>
</body>
</html>
